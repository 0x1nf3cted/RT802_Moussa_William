services:
  broker:
    image: eclipse-mosquitto:2
    container_name: rt0806-broker
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_pub -h 127.0.0.1 -p 1883 -t rt0806/health -m ok"]
      interval: 5s
      timeout: 3s
      retries: 10
